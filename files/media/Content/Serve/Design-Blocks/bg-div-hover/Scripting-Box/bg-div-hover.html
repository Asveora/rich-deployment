<!DOCTYPE html>
<html lang="en">
	<head>

	<style>

		.bg-img-div{
			background: url('https://cdn.asveora.social/Content/Serve/Design-Blocks/bg-div-hover/Image-Select/Pexels_Iriser_Berries_Photo_CMS.jpg') no-repeat; 
			-webkit-background-size: cover;
			-moz-background-size: cover;
			-o-background-size: cover;
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			background-color: var(--primary-color);
			border-radius: 50px;
			width: 500px;
			height: 250px;
			padding: 40px;
			margin-left: auto;
			margin-right: auto;
		}
	  
		.bg-tint{
			background-color: rgba(0,0,0,0);
			background-blend-mode: multiply;
			transition: 0.3s;
		}

		.bg-tint:hover{
			background-color: rgba(0,0,0,0.6);
			background-blend-mode: multiply;
		}
		
		.content-body-text{
			font-family: helvetica, arial, sans-serif;
			font-size: 22px;
			color: #ffffff;		
		}
	
	</style>

	</head>

	<body>

		<div class="content-body">
			<div class="bg-img-div bg-tint">
				<span class="content-body-text">This is a sample div with a background image. When you hover over this div, its background tint will change opacity.
				</span>
			</div>
		</div>
	
	</body>
</html>
